    <!--
      DIRECTION CONTRACT — TankGuard webapp · world: "Signal Room" (browser twin
      of the H1 home display, same state bands, same honesty rules).
      THESIS: one appliance, one page — the TankScore answers "is the water
      safe?" first, five parameter readings back it up, every reading carries a
      live trace, and nothing on screen claims more than the device measures.
      OWN-WORLD: paper #F2F1ED, panel #FFFFFF, ink #14171B, hairline #E4E2DC;
      cobalt #2647F0 as the only accent; Saira for numerals and display,
      system sans for running text; state colours match the H1 TFT firmware
      (good ≥70 #0E9F6E · watch ≥40 #C97A08 · attention <40 #D93A2B); channel
      hues are data, never decoration.
      HONESTY: data comes from the tank unit's GET /data endpoint or is a
      labelled DEMO feed; the browser keeps its own session log (1 sample/min,
      24 h cap) because the device stores no history; pump state is NOT shown —
      the pump is controlled by the H1 home unit, which has no server.
      FIRST VIEWPORT: wordmark bar with source chip · TankScore panel
      (numeral, state word, 18-segment dial-bar echoing H1, component strip)
      · five reading cards (the signature unit) · detail chart with session
      log · footer with the data-source verdict.
    -->
